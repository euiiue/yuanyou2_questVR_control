/**:
  ros__parameters:
    # 机器人描述包名：用于定位 URDF 所在包
    # 调整方法：如果更换机器人模型/包名，这里改为对应 package 名称
    robot_description_package: agx_arm_description
    # URDF 相对路径（相对于 robot_description_package）
    # 调整方法：切换不同末端工具、不同机器人版本时修改此路径
    urdf_relative_path: agx_arm_urdf/piper/urdf/piper_with_gripper_description.urdf

    # 机器人结构参数
    # 锁定不参与 IK 求解的关节名称列表（通常是夹爪或固定关节）
    # 调整方法：如果 IK 只解 7 轴机械臂，不希望夹爪参与求解，就把夹爪关节放这里
    locked_joints: ["gripper_base_joint", "gripper_joint1", "gripper_joint2"]
    # 末端执行器参考父关节：ee_frame 将挂载在该关节下
    # 调整方法：若末端从 joint6 改到其他关节，修改此项
    ee_parent_joint: "joint6" 
    # IK 末端 frame 名称（求解目标 frame）
    # 调整方法：保持与代码/调试工具中使用的末端 frame 一致
    ee_frame_name: "ee"
    # 输出关节顺序（发布到控制器时的关节名顺序）
    # 调整方法：必须与下游控制器期望顺序一致，顺序错误会导致运动异常
    output_joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]

    # 工具坐标系预旋转（RPY，单位 rad）：joint6 -> TCP 的旋转外参
    # 调整方法：末端姿态总是有固定偏差时调这里；无夹爪/无偏置可设为 [0,0,0]
    tool_pre_rot_rpy: [0.0, 0.0, 0.0]
    # 工具平移外参（单位 m）：joint6 -> TCP 的平移偏置
    # 调整方法：末端位置存在固定偏差时按实测值调整；无夹爪可设为 [0,0,0]
    tool_translation_xyz: [0.0, 0.0, 0.13]

    # 自碰撞检测对（扁平数组 [a,b,c,d] -> (a,b),(c,d)）
    # 调整方法：按 URDF 碰撞体索引配置；误配会导致误报或漏报
    collision_pairs_flat: [3, 0, 3, 1, 4, 0, 4, 1, 5, 0, 5, 1]
    # 是否启用碰撞检查
    # 调整建议：调试跟手性可先关（false）提升实时性；上机安全测试建议开（true）
    enable_collision_check: false

    # IK 优化参数
    # 位置误差权重：越大越“跟位置”，但可能牺牲姿态/平滑
    # 调整建议：跟手发软可增大；抖动明显可适当减小
    w_pos: 30.0    # DIAGNOSTIC: 极度优先位置精度
    # 姿态误差权重：越大越”跟姿态”，可能增加求解难度与抖动风险
    # 调整建议：末端朝向不准时增大；若抖动可减小
    w_ori: 0.35    # MEDIUM: 增强姿态跟踪
    # 正则项权重（趋向中性位）：越大越保守，动作幅度更小更稳
    # 调整建议：若关节总爱跑到极限可增大；若动作受限可减小
    w_reg: 0.001   # DIAGNOSTIC: 尽量不约束关节趋向中性位
    # 平滑项权重（约束与上一时刻解的差异）
    # 调整建议：增大更平滑但更迟滞；减小更跟手但可能抖动/跳解
    # 平滑项过大时会明显不跟手
    w_smooth: 0.02  # DIAGNOSTIC: 减少平滑阻力
    # IPOPT 最大迭代次数
    # 调整建议：解不收敛可增大；实时性不足可减小
    ipopt_max_iter: 50
    # IPOPT 收敛容差：越小越精确但更耗时，越大越快但误差可能变大
    # 调整建议：实时优先可适当放宽（如 1e-3），精度优先可收紧（如 1e-5）
    ipopt_tol: 1.0e-4

    # Meshcat 可视化参数
    # 是否启用可视化（会增加一定计算与通信开销）
    enable_visualization: false
    # 启动时是否自动打开浏览器
    viewer_open_browser: false
    # Meshcat 模型名称
    viewer_model_name: "pinocchio"
    # 目标 frame 可视化名称（末端目标坐标轴）
    viewer_target_frame_name: "ee_target"
    # 可视化坐标轴长度（m）
    viewer_axis_length: 0.1
    # 可视化坐标轴线宽
    viewer_axis_width: 10.0

    # I/O 话题
    # IK 输入末端目标位姿话题（通常来自 VR/pika pose节点）
    pose_stamped_topic: "/delta_pose"
    # 机械臂反馈关节状态话题（用于同步当前状态，提升解的连续性）
    feedback_joint_topic: "/feedback/joint_states"
    # pin_joint_status_topic: "/control/move_js"
    # IK 输出关节命令话题（发给控制器）
    # 调整建议：与底层控制模式匹配，位置模式常用 /control/joint_states 或 /control/move_j(s)
    pin_joint_status_topic: "/control/joint_states"

    # ── Delta Mapping 遥操作参数 ─────────────────────────────────
    delta_mapping_enabled: true
    hand_name: "auto"
    control_enable_topic: ""
    input_timeout_sec: 0.5
    require_feedback_before_latch: true

    # IK 残差阈值
    max_solution_pos_error: 0.10
    max_solution_ori_error: 1.80   # MEDIUM: 允许更大姿态误差

    # 姿态跟踪模式: hold_initial / track_limited / track_full
    orientation_mode: "track_limited"

    # VR 位移到机器人位移的缩放系数
    position_scale: 1.0

    # ── 位置映射矩阵 (扁平 9 元素, row-major, 代码内 reshape 3x3) ──
    # 左臂: [VR_x,VR_y,VR_z] → [robot_x(front),robot_y(down),robot_z(left)]
    position_map_left: [0.0, 0.0, -1.0, 0.0, -1.0, 0.0, -1.0, 0.0, 0.0]
    # 右臂: [VR_x,VR_y,VR_z] → [robot_x(front),robot_y(up),robot_z(right)]
    position_map_right: [0.0, 0.0, -1.0, 0.0, 1.0, 0.0, 1.0, 0.0, 0.0]

    # ── 非对称工作空间限制 (相对锁存点) ─────────────────────────
    max_delta_x_forward: 0.45
    max_delta_x_backward: 0.25
    max_delta_y_positive: 0.30
    max_delta_y_negative: 0.30
    max_delta_z_positive: 0.35
    max_delta_z_negative: 0.35

    # ── 位置目标滤波参数 (防抖抗噪) ─────────────────────────────
    target_pos_alpha: 0.55     # 低通系数 (0=不跟手, 1=无滤波)
    max_step_pos: 0.015        # 单帧最大步长 [m]
    deadband_pos: 0.0015       # 死区 [m]

    # ── 姿态跟踪参数 (track_limited 模式, 三档切换) ───────────────

    # ································································
    # Rotation profile: SAFE  (当前稳定版本, 约 ±34°)
    # orientation_gain: 0.35
    # max_orientation_delta_rad: 0.60
    # max_step_angle: 0.06
    # target_rot_alpha: 0.35
    # w_ori: 0.20
    # max_solution_ori_error: 1.20
    # ································································

    # ································································
    # Rotation profile: MEDIUM  ← 当前启用, 约 ±69°
    orientation_gain: 0.60
    max_orientation_delta_rad: 1.20
    max_step_angle: 0.09
    target_rot_alpha: 0.45
    # w_ori 和 max_solution_ori_error 见上方 IK 优化参数区
    # ································································

    # ································································
    # Rotation profile: LARGE  (MEDIUM 稳定后再试, 约 ±90°)
    # orientation_gain: 0.80
    # max_orientation_delta_rad: 1.57
    # max_step_angle: 0.12
    # target_rot_alpha: 0.55
    # w_ori: 0.50
    # max_solution_ori_error: 2.20
    # ································································

    rot_deadband: 0.012
    orientation_axis_gain: [1.0, 1.0, 1.0]  # rotvec x/y/z 三轴细调

    # 姿态映射矩阵 (扁平 9 元素, row-major)
    # 左臂
    orientation_map_left: [0.0, 0.0, -1.0, 0.0, -1.0, 0.0, -1.0, 0.0, 0.0]
    # 右臂
    orientation_map_right: [0.0, 0.0, -1.0, 0.0, 1.0, 0.0, 1.0, 0.0, 0.0]
